services:
  db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_manager"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  
  api:
    build:
      context: ./services/task-manager-api
      dockerfile: Dockerfile
    container_name: task-api
    environment:
      APP_ENV: dev
      AUTH_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg2://task_user:task_password@db:5432/task_manager
      CORS_ALLOW_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
      KEYCLOAK_ISSUER: http://localhost:8080/realms/devsecops
      KEYCLOAK_CLIENT_ID: task-manager-api
      KEYCLOAK_AUDIENCE: account
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/devsecops/protocol/openid-connect/certs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./services/task-manager-frontend
      dockerfile: Dockerfile
    container_name: task-frontend
    depends_on:
      - api
    ports:
      - "8081:80"
  
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: task-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"


  
volumes:
  postgres_data:
