services:
  db:
    image: postgres:16-alpine
    container_name: task-db
    environment:
      POSTGRES_DB: task_manager
      POSTGRES_USER: task_user
      POSTGRES_PASSWORD: task_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_manager"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  
  api:
    build:
      context: ./services/task-manager-api
      dockerfile: Dockerfile
    container_name: task-api
    environment:
      APP_ENV: dev
      AUTH_ENABLED: "false"
      DATABASE_URL: postgresql+psycopg2://task_user:task_password@db:5432/task_manager
      CORS_ALLOW_ORIGINS: http://localhost:8081,http://127.0.0.1:8081
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./services/task-manager-frontend
      dockerfile: Dockerfile
    container_name: task-frontend
    depends_on:
      - api
    ports:
      - "8081:80"
  
volumes:
  postgres_data:
