apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-cicd-workload-reader
  namespace: cicd
rules:
  - apiGroups: ["apps"]
    resources:
      - statefulsets
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods
      - services
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-cicd-workload-reader
  namespace: cicd
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: cicd
roleRef:
  kind: Role
  name: jenkins-cicd-workload-reader
  apiGroup: rbac.authorization.k8s.io
